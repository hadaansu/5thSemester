<html>
    <head>
        <style> 
            #dotted {
        border-style:dotted;
        border-color: green;
        border-width:4px;
       }
                #dashed {
        border-style:dashed;
        border-color: blue;
        border-width:4px;
       }
                #Solid {
        border-style:solid;
        border-color:pink ;
        border-width:4px;
       }         #double {
        border-style:double;
        border-color: lightgreen;
        border-width:4px;
       }
                #groove {
        border-style:groove;
        border-color: red;
        border-width:4px;
       }
                #ridge {
        border-style:ridge;
        border-color: gray;
        border-width:4px;
       }
                #inset {
        border-style:inset;
        border-color:black;
        border-width:4px;
       }
                #outset {
        border-style:outset;
        border-color: lightgreen;
        border-width:4px;
       }
                #none {
        border-style:none;
        border-color: green;
        border-width:4px;
        
  
       }
                #hidden {
        border-style:hidden;
        border-color: green;
        border-width:4px;
       }
                #mixed {
        border-style: dotted dashed solid double;
        border-color: red;
        border-width:4px;
           
       }
    </style>
      
    </head>
    <body>
        <p id="dotted"> A dotted Border.</p>
        <p id="dashed"> A dashed Border.</p>
            <p id="solid"> A  Solid Border.</p>
                <p id="groove"> A Groove Border.</p>
                    <p id="ridge"> A Ridge Border.</p>
                        <p id="inset"> A Inset Border.</p>
                            <p id="outset"> A Outset Border.</p>
                                <p id="none"> A None Border.</p>
                                    <p id="hidden"> A Hidden Border.</p>
                                        <p id="mixed"> A mixed Border.</p>
    </body>
</html>
