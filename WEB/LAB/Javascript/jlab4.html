<!DOCTYPE html>
<html>
<head>
    
</head>
<body>

<p id="myParagraph">
This is the original paragraph text. 
</p>

<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
    document.getElementById("myParagraph").innerText =
        "The paragraph text has been changed after clicking the button!";
}
</script>

</body>
</html>
