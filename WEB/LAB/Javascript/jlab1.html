<!DOCTYPE html>
<html>
<head>
  <title>Var, Let, Const Demo</title>
</head>
<body>

<h2>JavaScript Var, Let, Const Example</h2>

<script>
// VAR
var age = 25;          // Number
var name = "Anshu Hada";    // String
document.write("<b>VAR:</b> Age = " + age + ", Name = " + name + "<br>");

// LET
let city = "Paris";    // String
let score = 100;       // Number
document.write("<b>LET:</b> City = " + city + ", Score = " + score + "<br>");

// CONST
const pi = 3.14;       // Number
const country = "France"; // String
document.write("<b>CONST:</b> Pi = " + pi + ", Country = " + country + "<br>");

// Changing values
age = 30;            
city = "London";      
//pi = 3.141; 

document.write("<b>After change -> VAR:</b> Age = " + age + "<br>");
document.write("<b>After change -> LET:</b> City = " + city + "<br>");
document.write("<b>CONST remains:</b> Pi = " + pi + "<br>");
</script>

</body>
</html>
