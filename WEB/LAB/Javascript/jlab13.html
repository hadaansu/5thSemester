<!DOCTYPE html>
<html>
<head>
    <title>Number to String Conversion</title>
</head>
<body>



<script>
    // Declare a number variable
    var num = 100;

    // Display number and its datatype
    document.write("Value of num: " + num + "<br>");
    document.write("Datatype of num: " + typeof(num) + "<br>");

    // Convert number to string
    var str = num.toString();

    // Display string and its datatype
    document.write("Value after conversion: " + str + "<br>");
    document.write("Datatype after conversion: " + typeof(str) + "<br>");
</script>

</body>
</html>
