<!DOCTYPE html>
<html>
<head>
    <title>Window Event Example</title>

    <script>
        function showMessage() {
            alert("The window has finished loading!");
        }
    </script>

</head>

<body onload="showMessage()">

<h2>JavaScript Window Event Demo</h2>
<p>This message appears after the page loads.</p>

</body>
</html>
