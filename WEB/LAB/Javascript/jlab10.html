<!DOCTYPE html>
<html>
<head>
    <title>String Handling Functions</title>
</head>
<body>



<script>
    var str = "Hello JavaScript";

    document.write("Original String: " + str + "<br>");

    // length
    document.write("Length: " + str.length + "<br>");

    // toUpperCase()
    document.write("Uppercase: " + str.toUpperCase() + "<br>");

    // toLowerCase()
    document.write("Lowercase: " + str.toLowerCase() + "<br>");

    // charAt()
    document.write("Character at position 1: " + str.charAt(1) + "<br>");

    // indexOf()
    document.write("Index of 'Java': " + str.indexOf("Java") + "<br>");

    // substring()
    document.write("Substring (0,5): " + str.substring(0,5) + "<br>");

    // replace()
    document.write("Replace JavaScript with World: " + str.replace("JavaScript","World") + "<br>");
</script>

</body>
</html>
