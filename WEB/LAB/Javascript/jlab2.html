<!DOCTYPE html>
<html>
<head>
    <title>Even Numbers 1 to 100</title>
</head>
<body>

<h2>Not Divisible by 5</h2>

<script>
for (var i = 1; i <= 100; i++) {
    if (i % 5 != 0) {           // Check if the number is even
        document.write(i + " "); // Print number with space
    }
}
</script>

</body>
</html>
